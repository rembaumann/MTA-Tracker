<!DOCTYPE html>
<html lang="en" class="sl-theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mta-version" content="{{ version }}">
    <title>Settings · MTA Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/shoelace/themes/dark.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shoelace-mta.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}?v={{ version }}">
</head>
<body class="settings-page sl-theme-dark">
    <div class="settings">
        <header class="settings-top">
            <sl-button class="settings-back touch-button" href="/" size="large" variant="neutral">
                <sl-icon slot="prefix" name="chevron-left"></sl-icon>
                Board
            </sl-button>
            <h1>Settings</h1>
            <div class="settings-top-actions">
                <span id="save-status" class="save-status" role="status" aria-live="polite"></span>
                <sl-button id="edit" class="control-edit touch-button" size="large" variant="neutral" aria-pressed="false">Edit</sl-button>
            </div>
        </header>

        <nav class="settings-tabs" role="tablist" aria-label="Settings sections">
            <button type="button" class="settings-tab" role="tab" id="tab-stations" data-tab="stations" aria-controls="panel-stations" aria-selected="true">Stations</button>
            <button type="button" class="settings-tab" role="tab" id="tab-settings" data-tab="settings" aria-controls="panel-settings" aria-selected="false" tabindex="-1">Settings</button>
        </nav>

        <p id="banner" class="banner" hidden></p>

        <div class="settings-scroll" id="panel-stations" role="tabpanel" aria-labelledby="tab-stations">
            <section class="panel add-panel">
                <label class="search-label" for="search">Add a station</label>
                <div class="search-wrap">
                    <input id="search" class="search" type="search" placeholder="Search by name or line, such as Union Sq or Q" autocomplete="off" enterkeyhint="search" aria-controls="results">
                    <div id="results" class="results search-results" role="region" aria-label="Matching stations" hidden></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>On the board</h2>
                    <p id="board-hint">These stations cycle in order. Tap an arrow or a line to turn it off. Grey lines stay off the board.</p>
                </div>
                <div id="selected-list" class="selected-list"></div>
            </section>
        </div>

        <div class="settings-scroll" id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
            <section class="panel display-options">
                <h2>Display</h2>
                <div class="option-grid">
                    <label>Trains ahead
                        <input id="trains-ahead" type="number" min="1" max="20" inputmode="numeric" required>
                    </label>
                    <label>Trains per page
                        <input id="per-page" type="number" min="3" max="8" inputmode="numeric" required>
                    </label>
                    <label>Seconds on each page
                        <input id="cycle" type="number" min="5" max="120" inputmode="numeric" required>
                    </label>
                    <label>Weather ZIP
                        <input id="zip" type="text" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" required>
                    </label>
                </div>
            </section>

            <footer class="statusbar">
                <span id="save-note">Changes save automatically and reach the board within a few seconds.</span>
                <span class="version" id="app-version" title="Running version"></span>
            </footer>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/version.js') }}?v={{ version }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/settings.js') }}?v={{ version }}"></script>
</body>
</html>
