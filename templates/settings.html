<!DOCTYPE html>
<html lang="en" class="sl-theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mta-version" content="{{ version }}">
    <title>Settings · MTA Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/shoelace/themes/dark.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shoelace-mta.css') }}?v={{ version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}?v={{ version }}">
</head>
<body class="settings-page sl-theme-dark">
    <div class="settings">
        <header class="settings-top">
            <sl-button class="settings-back touch-button" href="/" size="large" variant="neutral">
                <sl-icon slot="prefix" name="chevron-left"></sl-icon>
                Board
            </sl-button>
            <h1>Stations</h1>
            <div class="settings-top-actions">
                <sl-button id="reorder" class="control-reorder touch-button" size="large" variant="neutral" aria-pressed="false">Reorder</sl-button>
                <sl-button id="save" class="control-save touch-button" size="large" variant="primary">Save</sl-button>
            </div>
        </header>

        <div class="settings-scroll">
            <p id="banner" class="banner" hidden></p>

            <section class="panel">
                <div class="panel-head">
                    <h2>On the board</h2>
                    <p id="board-hint">These stations cycle in order. Tap a direction or a line to turn it off. Grey lines stay off the board.</p>
                </div>
                <div id="selected-list" class="selected-list"></div>
            </section>

            <section class="panel">
                <label class="search-label" for="search">Add a station</label>
                <input id="search" class="search" type="search" placeholder="Search by name or line, such as Union Sq or Q" autocomplete="off" enterkeyhint="search">
                <div id="results" class="results"></div>
            </section>

            <section class="panel display-options">
                <h2>Display</h2>
                <div class="option-grid">
                    <label>Trains ahead
                        <input id="trains-ahead" type="number" min="1" max="20" inputmode="numeric">
                    </label>
                    <label>Trains per page
                        <input id="per-page" type="number" min="3" max="8" inputmode="numeric">
                    </label>
                    <label>Seconds on each page
                        <input id="cycle" type="number" min="5" max="120" inputmode="numeric">
                    </label>
                    <label>Weather ZIP
                        <input id="zip" type="text" inputmode="numeric" maxlength="5" pattern="[0-9]{5}">
                    </label>
                </div>
            </section>

            <footer class="statusbar">
                <span id="save-note">Changes apply on the board after you save.</span>
                <span class="version" id="app-version" title="Running version"></span>
            </footer>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/version.js') }}?v={{ version }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/settings.js') }}?v={{ version }}"></script>
</body>
</html>
